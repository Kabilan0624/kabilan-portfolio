<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions & Styling -->
  <defs>
    <style>
      .portfolio-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        font-size: 44px;
        letter-spacing: 5px;
        fill: #000000;
      }
    </style>
  </defs>

  <!-- Group: Portfolio Icon -->
  <g id="portfolio-folder-graphic">
    <!-- Back Left File / Tab -->
    <path d="M 107 143 a 6 6 0 0 1 6 -6 h 34 v 86 h -40 v -80 Z" fill="#000000" />

    <!-- Back Right File / Tab -->
    <path d="M 353 177 h 34 a 6 6 0 0 1 6 6 v 40 h -40 Z" fill="#000000" />

    <!-- Center Document Body with Corner Cutout -->
    <path d="M 152 79 h 156 v 44 h 41 v 102 h -197 Z" fill="#000000" />

    <!-- Dog-Ear Fold Triangle (Crisp Right Triangle with Separator Gap) -->
    <path d="M 314 83 v 36 h 36 Z" fill="#000000" />

    <!-- Document Content Lines (Crisp White Bars) -->
    <!-- Document Title Header -->
    <rect x="170" y="99" width="125" height="5" rx="2.5" fill="#FFFFFF" />

    <!-- Sub-Header Code / Meta Bars -->
    <rect x="170" y="117" width="30" height="4" rx="2" fill="#FFFFFF" />
    <rect x="170" y="127" width="55" height="4" rx="2" fill="#FFFFFF" />

    <!-- Document Body Content Lines (6 Parallel Rows) -->
    <rect x="170" y="149" width="160" height="3.5" rx="1.75" fill="#FFFFFF" />
    <rect x="170" y="159" width="160" height="3.5" rx="1.75" fill="#FFFFFF" />
    <rect x="170" y="169" width="160" height="3.5" rx="1.75" fill="#FFFFFF" />
    <rect x="170" y="179" width="160" height="3.5" rx="1.75" fill="#FFFFFF" />
    <rect x="170" y="189" width="160" height="3.5" rx="1.75" fill="#FFFFFF" />
    <rect x="170" y="199" width="160" height="3.5" rx="1.75" fill="#FFFFFF" />

    <!-- Front Folder Pocket (Subtle Inward Taper & Rounded Bottom) -->
    <path d="M 99 222 h 302 a 3 3 0 0 1 3 3.3 l -12 124.7 a 14 14 0 0 1 -13.9 12.7 h -256.2 a 14 14 0 0 1 -13.9 -12.7 l -12 -124.7 a 3 3 0 0 1 3 -3.3 Z" fill="#000000" />

    <!-- Avatar Badge on Front Pocket -->
    <!-- Head Circle -->
    <circle cx="170" cy="254" r="20" fill="#FFFFFF" />

    <!-- Bust & Shoulders with Arm Slits -->
    <path d="M 130 332 a 4 4 0 0 0 4 4 h 10 a 4 4 0 0 0 4 -4 v -36 a 2 2 0 0 1 2 -2 h 1 a 2 2 0 0 1 2 2 v 47 a 2 2 0 0 0 2 2 h 30 a 2 2 0 0 0 2 -2 v -47 a 2 2 0 0 1 2 -2 h 1 a 2 2 0 0 1 2 2 v 36 a 4 4 0 0 0 4 4 h 10 a 4 4 0 0 0 4 -4 v -38 c 0 -16 -12 -30 -30 -31 c -3.5 0 -7 2 -10 2 s -6.5 -2 -10 -2 c -18 1 -30 15 -30 31 Z" fill="#FFFFFF" />

    <!-- 3 Information Rows (Right Side of Badge) -->
    <rect x="232" y="254" width="71" height="8" rx="4" fill="#FFFFFF" />
    <rect x="232" y="287" width="137" height="8" rx="4" fill="#FFFFFF" />
    <rect x="232" y="320" width="137" height="8" rx="4" fill="#FFFFFF" />
  </g>

  <!-- Typography: PORTFOLIO (Centered Clean Modern Bold Sans-Serif) -->
  <text x="250" y="420" text-anchor="middle" class="portfolio-text">PORTFOLIO</text>
</svg>
